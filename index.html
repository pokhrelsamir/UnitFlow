<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="UnitFlow — A fast, modern and accurate smart unit converter."
    >

    <meta
        name="theme-color"
        content="#6366f1"
    >

    <title>UnitFlow — Smart Unit Converter</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">

        <div class="container nav">

            <a
                href="#"
                class="logo"
                aria-label="UnitFlow Home"
            >

                <span class="logo-icon">
                    ⚡
                </span>

                <span>
                    UnitFlow
                </span>

            </a>


            <button
                type="button"
                class="theme-btn"
                id="themeBtn"
                aria-label="Toggle dark mode"
                title="Toggle dark mode"
            >
                🌙
            </button>

        </div>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main>


        <!-- =====================================
             HERO
        ====================================== -->

        <section class="hero">

            <div class="container">

                <span class="badge">
                    ⚡ SMART UNIT CONVERTER
                </span>


                <h1>
                    Convert Anything.
                    <span>Instantly.</span>
                </h1>


                <p>
                    Fast, accurate and simple unit
                    conversions for everyday calculations.
                </p>

            </div>

        </section>



        <!-- =====================================
             CONVERTER
        ====================================== -->

        <section class="converter-section">

            <div class="container">


                <!-- Converter Card -->

                <div class="converter-card">


                    <!-- =================================
                         CATEGORY
                    ================================== -->

                    <div class="form-group category-group">

                        <label for="categoryTrigger">
                            Conversion Category
                        </label>


                        <div
                            class="custom-select"
                            id="categoryDropdown"
                        >

                            <button
                                type="button"
                                class="custom-select-trigger"
                                id="categoryTrigger"
                                aria-haspopup="listbox"
                                aria-expanded="false"
                                aria-controls="categoryMenu"
                            >

                                <span id="categorySelected">
                                    📏&nbsp;&nbsp; Length
                                </span>


                                <span
                                    class="dropdown-arrow"
                                    aria-hidden="true"
                                >
                                    ▾
                                </span>

                            </button>


                            <div
                                class="custom-select-menu"
                                id="categoryMenu"
                                role="listbox"
                                aria-label="Conversion categories"
                            >
                            </div>

                        </div>

                    </div>



                    <!-- =================================
                         CONVERSION ROW
                    ================================== -->

                    <div class="conversion-row">


                        <!-- =============================
                             FROM
                        ============================== -->

                        <div class="conversion-box">

                            <label for="fromUnit">
                                From
                            </label>


                            <select
                                id="fromUnit"
                                autocomplete="off"
                                aria-label="Convert from unit"
                            >
                            </select>


                            <input
                                type="number"
                                id="inputValue"
                                value="1"
                                placeholder="Enter value"
                                step="any"
                                inputmode="decimal"
                                autocomplete="off"
                                aria-label="Value to convert"
                            >

                        </div>



                        <!-- =============================
                             SWAP
                        ============================== -->

                        <button
                            type="button"
                            class="swap-btn"
                            id="swapBtn"
                            aria-label="Swap units"
                            title="Swap units"
                        >
                            ⇄
                        </button>



                        <!-- =============================
                             TO
                        ============================== -->

                        <div class="conversion-box">

                            <label for="toUnit">
                                To
                            </label>


                            <select
                                id="toUnit"
                                autocomplete="off"
                                aria-label="Convert to unit"
                            >
                            </select>


                            <div class="result-box">

                                <span
                                    id="result"
                                    aria-live="polite"
                                >
                                    1
                                </span>


                                <button
                                    type="button"
                                    class="copy-btn"
                                    id="copyBtn"
                                    aria-label="Copy result"
                                    title="Copy result"
                                >
                                    📋
                                </button>

                            </div>

                        </div>

                    </div>



                    <!-- =================================
                         CONVERSION INFORMATION
                    ================================== -->

                    <div class="conversion-info">


                        <!-- Conversion -->

                        <div class="conversion-description">

                            <span class="info-label">
                                Conversion
                            </span>


                            <strong id="conversionText">
                                1 m = 3.28084 ft
                            </strong>

                        </div>



                        <!-- Precision -->

                        <div class="precision-control">

                            <label
                                for="precision"
                                class="info-label"
                            >
                                Precision
                            </label>


                            <select
                                id="precision"
                                autocomplete="off"
                            >

                                <option value="2">
                                    2 decimals
                                </option>


                                <option value="4">
                                    4 decimals
                                </option>


                                <option
                                    value="6"
                                    selected
                                >
                                    6 decimals
                                </option>


                                <option value="8">
                                    8 decimals
                                </option>

                            </select>

                        </div>

                    </div>

                </div>



                <!-- =====================================
                     POPULAR CONVERSIONS
                ====================================== -->

                <section
                    class="popular-section"
                    aria-labelledby="popularHeading"
                >

                    <div class="section-heading">

                        <div>

                            <span class="section-label">
                                QUICK ACCESS
                            </span>


                            <h2 id="popularHeading">
                                Popular Conversions
                            </h2>

                        </div>

                    </div>


                    <div class="popular-grid">


                        <!-- Meter → Feet -->

                        <button
                            type="button"
                            class="popular-card"
                            data-category="length"
                            data-from="meter"
                            data-to="foot"
                        >

                            <span aria-hidden="true">
                                📏
                            </span>


                            <strong>
                                Meter → Feet
                            </strong>


                            <small>
                                Length
                            </small>

                        </button>



                        <!-- Km → Miles -->

                        <button
                            type="button"
                            class="popular-card"
                            data-category="length"
                            data-from="kilometer"
                            data-to="mile"
                        >

                            <span aria-hidden="true">
                                🛣️
                            </span>


                            <strong>
                                Km → Miles
                            </strong>


                            <small>
                                Length
                            </small>

                        </button>



                        <!-- Celsius → Fahrenheit -->

                        <button
                            type="button"
                            class="popular-card"
                            data-category="temperature"
                            data-from="celsius"
                            data-to="fahrenheit"
                        >

                            <span aria-hidden="true">
                                🌡️
                            </span>


                            <strong>
                                °C → °F
                            </strong>


                            <small>
                                Temperature
                            </small>

                        </button>



                        <!-- Kg → Pounds -->

                        <button
                            type="button"
                            class="popular-card"
                            data-category="mass"
                            data-from="kilogram"
                            data-to="pound"
                        >

                            <span aria-hidden="true">
                                ⚖️
                            </span>


                            <strong>
                                Kg → Pounds
                            </strong>


                            <small>
                                Mass
                            </small>

                        </button>



                        <!-- Liters → Gallons -->

                        <button
                            type="button"
                            class="popular-card"
                            data-category="volume"
                            data-from="liter"
                            data-to="gallon"
                        >

                            <span aria-hidden="true">
                                🧪
                            </span>


                            <strong>
                                Liters → Gallons
                            </strong>


                            <small>
                                Volume
                            </small>

                        </button>



                        <!-- MB → GB -->

                        <button
                            type="button"
                            class="popular-card"
                            data-category="data"
                            data-from="megabyte"
                            data-to="gigabyte"
                        >

                            <span aria-hidden="true">
                                💾
                            </span>


                            <strong>
                                MB → GB
                            </strong>


                            <small>
                                Digital Data
                            </small>

                        </button>

                    </div>

                </section>



                <!-- =====================================
                     HISTORY
                ====================================== -->

                <section
                    class="history-section"
                    aria-labelledby="historyHeading"
                >

                    <div class="section-heading">

                        <div>

                            <span class="section-label">
                                RECENT
                            </span>


                            <h2 id="historyHeading">
                                Conversion History
                            </h2>

                        </div>


                        <button
                            type="button"
                            class="clear-btn"
                            id="clearHistory"
                        >
                            Clear History
                        </button>

                    </div>


                    <div
                        class="history-list"
                        id="historyList"
                        aria-live="polite"
                    >
                    </div>

                </section>

            </div>

        </section>

    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="footer">

        <div class="container">

            <p>
                ⚡
                <strong>UnitFlow</strong>
                — Smart Unit Converter
            </p>


            <p>
                Built with HTML, CSS &amp; JavaScript
            </p>

        </div>

    </footer>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="js/units.js"></script>

    <script src="js/converter.js"></script>

    <script src="js/storage.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
